# /etc/security/pwquality.conf   (needs: sudo apt install libpam-pwquality)

# at least 10 characters, with an uppercase letter, a lowercase letter and a digit
minlen = 10
ucredit = -1
lcredit = -1
dcredit = -1

# no more than 3 identical characters in a row, and not the user name
maxrepeat = 3
usercheck = 1

# at least 7 characters that were not in the old password (not checked for root)
difok = 7

# root has to follow the same rules
enforce_for_root
